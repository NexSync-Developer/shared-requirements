name: Trigger Bot Redeploys

# Löst bei jeder Änderung an constraints.txt (Push auf main) einen Redeploy
# aller abhängigen Bot-Apps in Dokploy aus, indem deren Deploy-Webhooks
# aufgerufen werden.
#
# Voraussetzung: Für jeden Bot ein GitHub-Secret mit der Dokploy-Webhook-URL
# anlegen (Repo → Settings → Secrets and variables → Actions), z. B.
# DOKPLOY_WEBHOOK_ITZU. Für weitere Bots einfach nach demselben Muster
# ein neues Secret anlegen und unten einen weiteren Step ergänzen.

on:
  push:
    branches: [main]
    paths:
      - "constraints.txt"

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy iTzu
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_ITZU }}"
